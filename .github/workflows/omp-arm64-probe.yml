name: omp-arm64-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install Rtools aarch64
        shell: pwsh
        run: |
          curl -o rtools45.exe -L https://github.com/r-windows/rtools-chocolatey/releases/download/6768/rtools45-aarch64-6768-6492.exe
          Start-Process "rtools45.exe" -argumentlist "/VERYSILENT /SUPPRESSMSGBOXES" -wait
      - name: Build and run
        shell: pwsh
        run: |
          $bin = "C:\rtools45-aarch64\aarch64-w64-mingw32.static.posix\bin"
          & "$bin\clang++.exe" --version
          & "$bin\clang++.exe" -O2 -fopenmp dev_notes/omp_arm64_probe.cpp -o probe.exe
          .\probe.exe
