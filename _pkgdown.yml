url: https://gillescolling.com/tulpaRatio

template:
  bootstrap: 5
  bootswatch: sandstone
  light-switch: true

figures:
  dev: svg
  fig.ext: svg
  bg: "#F5F6F8"

home:
  title: "tulpaRatio: Bayesian Hierarchical Models for Ratios"
  description: >
    Joint modelling of numerator and denominator processes with shared latent
    structure. Ratios computed post hoc with full uncertainty propagation.

authors:
  Gilles Colling:
    href: https://github.com/gcol33

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, lightswitch, github]
  components:
    intro:
      text: Get Started
      href: articles/getting-started.html
    articles:
      text: Articles
      menu:
        - text: "Quick Start"
          href: articles/getting-started.html
        - text: "Why Ratios Are Not Data"
          href: articles/philosophy.html
        - text: "---"
        - text: "Complete Workflows"
          href: articles/workflows.html
        - text: "Spatial and Temporal Models"
          href: articles/spatial-temporal.html
        - text: "Random Effects"
          href: articles/random-effects.html
    github:
      icon: fab fa-github
      href: https://github.com/gcol33/tulpaRatio
      aria-label: GitHub

